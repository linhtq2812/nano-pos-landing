<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<!-- Share image (1200×630), same look as the landing hero. Render:
     node tools/shots/render.mjs tools/shots/og.html assets/og.png 1200 630 -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: 'Be Vietnam Pro', sans-serif; color: #E2E8F0; background: #0B1120; }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(560px 380px at 82% 20%, rgba(45,212,191,.32), transparent 70%),
      radial-gradient(500px 360px at 0% 0%, rgba(20,184,166,.18), transparent 70%),
      radial-gradient(800px 420px at 60% 120%, rgba(15,118,110,.45), transparent 70%); }
  .grid { position: absolute; inset: 0; opacity: .35;
    background-image: linear-gradient(rgba(148,163,184,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.09) 1px, transparent 1px);
    background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse at 30% 40%, #000 30%, transparent 75%); }
  .left { position: absolute; left: 64px; top: 60px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 26px; color: #F8FAFC; letter-spacing: -.02em; margin-bottom: 40px; }
  .brand img { width: 44px; height: 44px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 5px 14px 5px 5px; border-radius: 999px; background: rgba(45,212,191,.1); border: 1px solid rgba(45,212,191,.3); color: #CCFBF1; font-size: 17px; font-weight: 600; margin-bottom: 22px; }
  .pill b { background: #2DD4BF; color: #042F2E; padding: 2px 11px; border-radius: 999px; font-size: 15px; }
  h1 { font-size: 60px; line-height: 1.08; margin: 0 0 20px; font-weight: 800; letter-spacing: -.03em; color: #F8FAFC; }
  .grad { background: linear-gradient(100deg, #2DD4BF, #5EEAD4 45%, #A7F3D0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { font-size: 22px; line-height: 1.5; color: #A5B4C8; margin: 0; }
  .apps { position: absolute; left: 64px; bottom: 52px; display: flex; gap: 12px; align-items: center; color: #A5B4C8; font-size: 18px; font-weight: 600; }
  .apps img { width: 40px; height: 40px; }
  .apps span { margin-left: 6px; }
  .stage { position: absolute; left: 650px; top: 92px; width: 640px; perspective: 1400px; }
  .browser { border-radius: 14px 14px 0 0; overflow: hidden; background: #fff; transform: rotateY(-14deg) rotateX(6deg); transform-origin: 0 50%; box-shadow: 0 40px 80px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(148,163,184,.2); }
  .bar { height: 26px; background: #E8EDF3; display: flex; gap: 6px; align-items: center; padding: 0 12px; }
  .bar i { width: 9px; height: 9px; border-radius: 50%; }
  .bar i:nth-child(1) { background: #F87171; } .bar i:nth-child(2) { background: #FBBF24; } .bar i:nth-child(3) { background: #34D399; }
  .browser img { display: block; width: 100%; }
  .phone { position: absolute; left: 900px; top: 250px; width: 200px; padding: 7px; border-radius: 30px; background: #020617; box-shadow: 0 40px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(148,163,184,.2); }
  .phone img { display: block; width: 100%; border-radius: 24px; }
  .chip { position: absolute; left: 610px; top: 430px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: rgba(15,23,42,.88); border: 1px solid rgba(148,163,184,.25); font-size: 16px; font-weight: 600; box-shadow: 0 16px 30px -12px rgba(0,0,0,.7); }
  .chip .dot { width: 30px; height: 30px; border-radius: 9px; background: rgba(45,212,191,.18); display: grid; place-items: center; color: #2DD4BF; font-weight: 800; }
  .chip small { display: block; color: #A5B4C8; font-weight: 500; font-size: 13px; }
</style></head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="left">
    <div class="brand"><img src="../../assets/brand/pos.svg" alt="">NanoPOS</div>
    <span class="pill"><b>Miễn phí</b>Phần mềm bán hàng cho cửa hàng nhỏ</span>
    <h1>Bán hàng <span class="grad">miễn phí</span>.<br>Quản lý từ xa.</h1>
    <p>App quầy bán cả khi mất mạng, thu tiền VietQR. Thêm web và app quản lý khi cửa hàng lớn lên.</p>
  </div>
  <div class="apps"><img src="../../assets/brand/pos.svg" alt=""><img src="../../assets/brand/manager.svg" alt=""><img src="../../assets/brand/admin.svg" alt=""><span>App quầy · Nano Manager · Nano Admin</span></div>
  <div class="stage"><div class="browser"><div class="bar"><i></i><i></i><i></i></div><img src="../../assets/shots/admin-dashboard.webp" alt=""></div></div>
  <div class="phone"><img src="../../assets/shots/pos-sale.webp" alt=""></div>
  <div class="chip"><span class="dot">✓</span><span>Đã nhận qua VietQR<small>286.000đ</small></span></div>
</body></html>

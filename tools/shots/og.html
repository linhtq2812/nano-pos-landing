<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Be Vietnam Pro', sans-serif;
         background: radial-gradient(900px 500px at 100% 0%, #CCFBF1, transparent 70%), #F8FAFC; color: #0F172A; position: relative; }
  .left { position: absolute; left: 64px; top: 64px; width: 560px; }
  .icons { display: flex; gap: 14px; margin-bottom: 36px; }
  .icons img { width: 64px; height: 64px; }
  h1 { font-size: 58px; line-height: 1.08; margin: 0 0 22px; font-weight: 800; letter-spacing: -.02em; }
  h1 span { color: #0F766E; }
  p { font-size: 24px; line-height: 1.45; color: #475569; margin: 0; }
  .brand { position: absolute; left: 64px; bottom: 52px; font-weight: 800; font-size: 26px; color: #0F766E; }
  .browser { position: absolute; left: 640px; top: 96px; width: 640px; border-radius: 14px; overflow: hidden; background: #fff;
             box-shadow: 0 20px 50px rgba(15,23,42,.18); border: 1px solid #E2E8F0; }
  .bar { height: 26px; background: #E2E8F0; display: flex; gap: 6px; align-items: center; padding: 0 12px; }
  .bar i { width: 9px; height: 9px; border-radius: 50%; background: #CBD5E1; }
  .browser img { display: block; width: 100%; }
  .phone { position: absolute; left: 960px; top: 230px; width: 190px; padding: 7px; border-radius: 28px; background: #0F172A;
           box-shadow: 0 20px 50px rgba(15,23,42,.3); }
  .phone img { display: block; width: 100%; border-radius: 22px; }
</style></head>
<body>
  <div class="left">
    <div class="icons"><img src="../../assets/brand/pos.svg"><img src="../../assets/brand/manager.svg"><img src="../../assets/brand/admin.svg"></div>
    <h1>Bán hàng <span>miễn phí</span>.<br>Quản lý từ xa.</h1>
    <p>App quầy miễn phí, bán cả khi mất mạng, thu tiền VietQR. Thêm web và app quản lý khi cửa hàng lớn lên.</p>
  </div>
  <div class="brand">NanoPOS</div>
  <div class="browser"><div class="bar"><i></i><i></i><i></i></div><img src="../../assets/shots/admin-dashboard.webp"></div>
  <div class="phone"><img src="../../assets/shots/pos-sale.webp"></div>
</body></html>
